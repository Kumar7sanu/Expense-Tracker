<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <!-- Dashboard Data -->
    <script src="data.js"></script>

    <style>

        /* ===========================
           RESET
        =========================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{

    font-family:
        Inter,
        system-ui,
        Arial,
        sans-serif;

    background:var(--bg);

    color:var(--text);

    padding:35px;

    min-height:100vh;

}

        /* ===========================
           COLOR SYSTEM
        =========================== */

        :root{

    /* Background */

    --bg:#0F172A;

    --card:#1E293B;

    --card-hover:#263445;

    --border:#334155;

    /* Text */

    --text:#F8FAFC;

    --muted:#94A3B8;

    /* Accent */

    --green:#22C55E;

    --red:#EF4444;

    --blue:#3B82F6;

    --orange:#F59E0B;

    --purple:#8B5CF6;

    --cyan:#06B6D4;

    /* Radius */

    --radius:18px;

    /* Shadow */

    --shadow:
        0 10px 30px rgba(0,0,0,.25);

}
        /* ===========================
           LAYOUT
        =========================== */

        .container{

            max-width:1500px;

            margin:auto;

        }

        /* ===========================
           HEADER
        =========================== */

        .header{

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    margin-bottom:40px;

}

.header h1{

    font-size:44px;

    font-weight:700;

}

.subtitle{

    color:var(--muted);

    margin-top:10px;

    font-size:17px;

}

        /* ===========================
           CARD
        =========================== */

.card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:24px;

    box-shadow:var(--shadow);

    transition:.30s;

}

.card:hover{

    transform:translateY(-6px);

    background:var(--card-hover);

}
.section-title{

    font-size:22px;

    font-weight:700;

    margin-bottom:24px;

    letter-spacing:.3px;

}

        /* ===========================
           KPI GRID
        =========================== */

        .kpi-grid{

            display:grid;

            grid-template-columns:
                repeat(6,1fr);

            gap:20px;

            margin-bottom:30px;

        }

.kpi{

    min-height:110px;

    display:flex;

    flex-direction:column;

    justify-content:center;

}

.kpi-placeholder{

    width:60%;

    height:18px;

    background:#334155;

    border-radius:10px;

    margin-bottom:12px;

}

.kpi-placeholder.small{

    width:40%;

    height:12px;

}

        /* ===========================
           MAIN GRID
        =========================== */

        .dashboard-grid{

            display:grid;

            grid-template-columns:
                1fr 1fr;

            gap:26px;

        }

        .full-width{

            grid-column:1/-1;

        }

        /* ===========================
           PLACEHOLDER
        =========================== */

        .placeholder{

    height:280px;

    display:flex;

    justify-content:center;

    align-items:center;

    border:2px dashed var(--border);

    border-radius:16px;

    color:#64748B;

    font-size:22px;

    background:rgba(255,255,255,.02);

}

        /* ===========================
           RESPONSIVE
        =========================== */

        @media(max-width:1300px){

    .kpi-grid{

        grid-template-columns:
        repeat(3,1fr);

    }

}

@media(max-width:900px){

    .dashboard-grid{

        grid-template-columns:1fr;

    }

}

@media(max-width:768px){

    body{

        padding:18px;

    }

    .header{

        flex-direction:column;

        align-items:flex-start;

        gap:10px;

    }

    .header h1{

        font-size:34px;

    }

    .kpi-grid{

        grid-template-columns:
        repeat(2,1fr);

    }

}

@media(max-width:520px){

    .kpi-grid{

        grid-template-columns:1fr;

    }

}

.card{

    animation:fadeUp .6s ease both;

}

.card:nth-child(1){animation-delay:.05s;}
.card:nth-child(2){animation-delay:.10s;}
.card:nth-child(3){animation-delay:.15s;}
.card:nth-child(4){animation-delay:.20s;}
.card:nth-child(5){animation-delay:.25s;}
.card:nth-child(6){animation-delay:.30s;}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(15px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

    </style>

</head>

<body>

<div class="container">

    <!-- ======================
         HEADER
    ======================= -->

    <div class="header">

        <h1>💰 Personal Expense Tracker</h1>

        <div class="subtitle"
             id="dashboardSubtitle">

            Offline Analytics Dashboard

        </div>

    </div>

    <!-- ======================
         KPI CARDS
    ======================= -->

    <div class="kpi-grid">

        <div class="card kpi">

    <div class="kpi-placeholder"></div>

    <div class="kpi-placeholder small"></div>

</div>

       <div class="card kpi">

    <div class="kpi-placeholder"></div>

    <div class="kpi-placeholder small"></div>

</div>

       <div class="card kpi">

    <div class="kpi-placeholder"></div>

    <div class="kpi-placeholder small"></div>

</div>

        <div class="card kpi">

    <div class="kpi-placeholder"></div>

    <div class="kpi-placeholder small"></div>

</div>

        <div class="card kpi">

    <div class="kpi-placeholder"></div>

    <div class="kpi-placeholder small"></div>

</div>

       <div class="card kpi">

    <div class="kpi-placeholder"></div>

    <div class="kpi-placeholder small"></div>

</div>

    </div>

    <!-- ======================
         DASHBOARD
    ======================= -->

    <div class="dashboard-grid">

        <div class="card">

            <div class="section-title">
                Expense Breakdown
            </div>

            <div class="placeholder">
                Donut Chart
            </div>

        </div>

        <div class="card">

            <div class="section-title">
                Category Breakdown
            </div>

            <div class="placeholder">
                Category Bars
            </div>

        </div>

        <div class="card full-width">

            <div class="section-title">
                Monthly Trend
            </div>

            <div class="placeholder">
                Monthly Chart
            </div>

        </div>

        <div class="card">

            <div class="section-title">
                Budget Health
            </div>

            <div class="placeholder">
                Budget Widget
            </div>

        </div>

        <div class="card">

            <div class="section-title">
                Recent Transactions
            </div>

            <div class="placeholder">
                Transactions
            </div>

        </div>

        <div class="card full-width">

            <div class="section-title">
                Smart Insights
            </div>

            <div class="placeholder">
                AI Insights
            </div>

        </div>

    </div>

</div>

</body>

</html>
